spring.application.name=MSA1

# In-memory H2 (режим совместимости с MySQL) - только для интеграционных тестов
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Схема генерируется из JPA-сущностей
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (доступна в браузере при запуске с профилем test)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON (как в production-конфигурации)
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Flyway в тестах отключён: схему для H2 строит Hibernate (create-drop)
spring.flyway.enabled=false
